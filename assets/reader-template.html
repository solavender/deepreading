<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--paper:#f7f1e5;--ink:#2f2a24;--muted:#766e62;--line:#d8cdbb;--panel:#fffaf0;--accent:#9a543b;--font:18px;--leading:1.95;--measure:720px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:var(--font);line-height:var(--leading)}body.night{--paper:#191816;--ink:#ece4d6;--muted:#bcb2a2;--line:#3d3933;--panel:#24211d;--accent:#e59b79}body.white{--paper:#fff;--panel:#fff;--line:#ddd}.top{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}button,input,select{font:inherit}.icon,.action{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}.icon:focus-visible,.action:focus-visible,input:focus-visible{outline:3px solid #4b8cff;outline-offset:2px}.brand{font-family:system-ui,sans-serif;font-size:14px;letter-spacing:.08em}.status{font:12px system-ui;color:var(--muted)}main{max-width:var(--measure);margin:0 auto;padding:64px 28px 180px}.cover{text-align:center;padding:12vh 0 15vh}.cover .eyebrow{font:12px system-ui;letter-spacing:.2em;color:var(--muted)}h1{font-size:clamp(32px,5vw,54px);line-height:1.35;font-weight:600;margin:30px auto 18px}h2{margin:3.5em 0 1.2em;text-align:center;font-size:1.65em}h3{margin:2.6em 0 1em;font-size:1.3em}.block{position:relative;margin:0 0 1.15em;text-align:justify;overflow-wrap:anywhere}.block[data-kind=frontmatter]{color:var(--muted)}.block[data-kind=table-row]{font-family:system-ui,sans-serif;font-size:.82em;line-height:1.45;margin:.2em 0;padding:.4em .7em;border-bottom:1px solid var(--line)}.page{font:11px system-ui;color:var(--muted);text-align:center;margin:5em 0 1.5em}.source-toggle{float:right;font:11px system-ui;color:var(--muted);border:0;background:transparent;cursor:pointer}.source{display:none;margin:.6em 0;padding:12px 15px;background:var(--panel);border-left:3px solid var(--line);font-size:.88em;color:var(--muted)}.source.open{display:block}.fig{margin:1.5em auto 3em;text-align:center}.fig img{max-width:100%;max-height:70vh;border-radius:8px;box-shadow:0 12px 40px #0002;cursor:zoom-in}.fig small{display:block;color:var(--muted);font:12px system-ui;margin-top:8px}mark{padding:.05em 0;border-radius:2px;color:inherit}mark.yellow{background:#f6dc75aa}mark.blue{background:#8dc7ef99}mark.green{background:#9ed8ab99}mark.pink{background:#ef9fbc99}.drawer{position:fixed;z-index:40;top:0;bottom:0;width:min(390px,92vw);background:var(--panel);box-shadow:0 0 35px #0003;padding:18px;overflow:auto;transition:transform .25s}.drawer.left{left:0;transform:translateX(-105%)}.drawer.right{right:0;transform:translateX(105%)}.drawer.open{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:var(--panel);padding:12px 0;border-bottom:1px solid var(--line);z-index:2}.drawer h2{text-align:left;margin:1.3em 0 .5em;font:600 17px system-ui}.toc a,.result{display:block;color:var(--ink);text-decoration:none;padding:8px;border-radius:8px;font:14px/1.4 system-ui}.toc a:hover,.result:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}.note{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font:13px/1.55 system-ui}.note .meta{color:var(--muted);font-size:11px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px}.toolbar{position:fixed;z-index:25;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px;padding:8px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 35px #0002;backdrop-filter:blur(12px)}.swatch{width:29px;height:29px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer}.yellow{background:#f6dc75}.blue{background:#8dc7ef}.green{background:#9ed8ab}.pink{background:#ef9fbc}.overlay{position:fixed;inset:0;background:#0008;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.overlay.open{display:flex}.modal{background:var(--panel);max-width:640px;width:100%;max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.modal img{width:100%}.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}.notice{padding:10px 12px;background:#c86b4420;border:1px solid #c86b4450;border-radius:10px;font:13px/1.5 system-ui}.hidden{display:none!important}@media(max-width:760px){main{padding:38px 20px 140px}.top .brand{max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.compare{grid-template-columns:1fr}.toolbar{max-width:94vw;overflow:auto}.cover{padding-top:7vh}.source-toggle{float:none;display:block;margin-left:auto}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
body[data-style="minimal"]{--paper:#f7f8fa;--panel:#fff;--ink:#222832;--muted:#687386;--line:#dfe3e8;--accent:#4b77be;font-family:system-ui,sans-serif}body[data-style="minimal"] .cover{text-align:left}body[data-style="glass"]{--paper:#cbd6ff;--panel:#ffffffcc;--ink:#1f2945;--muted:#536182;--line:#ffffff99;--accent:#6b59d3;background:radial-gradient(circle at 15% 5%,#fff 0,#c8d6ff 35%,#d8c7f5 100%);background-attachment:fixed}body[data-style="glass"] main{background:#ffffffb5;border:1px solid #fff9;border-radius:28px;margin-top:30px;box-shadow:0 30px 80px #344b8a22}body[data-style="research"]{--paper:#eef1f3;--panel:#fff;--ink:#1e2730;--muted:#5d6872;--line:#ccd3d9;--accent:#9b3f43;font-family:system-ui,sans-serif;--measure:820px}body[data-style="research"] main{border-left:1px solid var(--line);border-right:1px solid var(--line);background:#fff}body[data-style="research"] .block{font-size:.92em;line-height:1.7}
</style></head><body>
<header class="top"><div class="row"><button class="icon" id="tocBtn" aria-label="打开目录">目录</button><button class="icon" id="searchBtn">搜索</button></div><div class="brand" id="brand">PDF 阅读器</div><div class="row"><span class="status" id="saveState">已保存</span><button class="icon" id="toolsBtn">工具</button></div></header>
<aside class="drawer left" id="leftDrawer" aria-label="目录与搜索"><div class="drawer-head"><b>阅读导航</b><button class="icon close">关闭</button></div><input id="search" class="field" placeholder="搜索整理后文字、原始文字与批注"><div id="searchResults"></div><h2>目录</h2><nav class="toc" id="toc"></nav></aside>
<aside class="drawer right" id="rightDrawer" aria-label="批注与工具"><div class="drawer-head"><b>笔记与工具</b><button class="icon close">关闭</button></div><h2>筛选批注</h2><div class="row"><select id="sectionFilter" class="field"><option value="">全部章节</option></select><select id="colorFilter" class="field"><option value="">全部颜色</option><option value="yellow">黄色</option><option value="blue">蓝色</option><option value="green">绿色</option><option value="pink">粉色</option></select><input id="noteFilter" class="field" placeholder="关键词"><button class="action" id="selectVisible">选择当前结果</button><button class="action" id="clearSelection">清空选择</button></div><div id="notes"></div><h2>阅读设置</h2><label>主题 <select id="theme" class="field"><option value="paper">纸张</option><option value="white">浅色</option><option value="night">夜间</option></select></label><label>字号 <input id="fontSize" type="range" min="15" max="36" value="18" class="field"></label><label>行距 <input id="lineHeight" type="range" min="15" max="26" value="20" class="field"></label><label>栏宽 <input id="width" type="range" min="560" max="1000" value="720" class="field"></label><h2>术语表</h2><div id="terms"></div><h2>备份与导出</h2><div class="row"><button class="action" id="exportJson">导出备份</button><button class="action" id="importJson">导入备份</button><input type="file" id="importFile" accept="application/json" hidden><button class="action" id="exportMd">笔记 Markdown</button><button class="action" id="exportWord">Word兼容 .doc</button><button class="action" id="exportHtml">含批注 HTML</button></div><h2>内容检查</h2><div class="notice" id="qualityNotice"></div></aside>
<main id="reader"><section class="cover"><div class="eyebrow">PDF 阅读工作流</div><h1>__TITLE__</h1><p id="subtitle"></p><p class="status" id="styleLabel"></p></section><div id="content"></div></main>
<div class="toolbar" aria-label="文本标注工具"><span class="status">选择文字后：</span><button class="swatch yellow" data-color="yellow" title="黄色高亮"></button><button class="swatch blue" data-color="blue" title="蓝色高亮"></button><button class="swatch green" data-color="green" title="绿色高亮"></button><button class="swatch pink" data-color="pink" title="粉色高亮"></button><button class="action" id="copyCitation">复制出处</button></div>
<div class="overlay" id="imageModal"><div class="modal"><button class="icon" id="closeImage">关闭</button><img id="largeImage" alt="放大图页"></div></div>
<script id="documentData" type="application/json">__DOCUMENT_DATA__</script>
<script>
(()=>{'use strict';const D=JSON.parse(document.getElementById('documentData').textContent),key='reader:'+D.documentId+':'+D.revision,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],styleNames={minimal:'Notion / Arc 极简知识型',books:'Apple Books 沉浸阅读型',glass:'Liquid Glass 玻璃质感型',research:'Margin Notes 研究批注型'},filenameBase=(D.metadata.title||'PDF阅读器').replace(/[\\/:*?"<>|]/g,'-').slice(0,80);document.body.dataset.style=D.selectedStyle||'books';$('#brand').textContent=(D.metadata.title||'PDF 阅读器')+' · 阅读器';$('#subtitle').textContent=D.metadata.subtitle||'';$('#styleLabel').textContent=styleNames[D.selectedStyle]||styleNames.books;$('#qualityNotice').textContent=`${new Set(D.blocks.flatMap(b=>b.pdfPages)).size} 个物理页、${D.blocks.length} 个内容块、${D.figures.length} 幅图表。${D.issues.length?'仍有 '+D.issues.length+' 类内容待核对。':'内容映射未发现待核对项。'}术语解释若标记为“阅读辅助”，不代表作者原始定义。Word 导出为 Word 可打开的 HTML .doc，并非原生 DOCX。本地保存不会自动跨设备同步，请使用备份迁移。`;let state={schemaVersion:1,documentId:D.documentId,revision:D.revision,annotations:[],tombstones:[],position:null,settings:{theme:'paper',font:18,leading:20,width:720}},selectedNotes=new Set();try{const x=JSON.parse(localStorage.getItem(key)||'null');if(x&&x.documentId===D.documentId)state={...state,...x,settings:{...state.settings,...x.settings}}}catch(e){}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(key,JSON.stringify(state));$('#saveState').textContent='已保存';return true}catch(e){$('#saveState').textContent='未保存·请导出备份';return false}};const download=(name,type,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
const annFor=id=>state.annotations.filter(a=>!a.deleted&&a.blockId===id).sort((a,b)=>a.start-b.start);function renderText(block){const anns=annFor(block.id);if(!anns.length)return esc(block.processedText);let out='',pos=0;for(const a of anns){if(a.start<pos||a.end>block.processedText.length)continue;out+=esc(block.processedText.slice(pos,a.start));out+='<mark class="'+a.color+'" data-ann="'+a.id+'" tabindex="0">'+esc(block.processedText.slice(a.start,a.end))+'</mark>';pos=a.end}return out+esc(block.processedText.slice(pos))}
function render(){const c=$('#content');c.innerHTML='';let currentPage=0;for(const b of D.blocks){if(b.pdfPages[0]!==currentPage){currentPage=b.pdfPages[0];c.insertAdjacentHTML('beforeend','<div class="page">物理页 '+currentPage+'</div>')}const tag=b.kind==='heading'?(b.processedText.match(/^\d+\.\d+/)?'h3':'h2'):'div',el=document.createElement(tag);el.className='block';el.id=b.id;el.dataset.kind=b.kind;el.dataset.page=b.pdfPages[0];el.innerHTML=renderText(b)+(b.kind!=='heading'?'<button class="source-toggle" data-source="'+b.id+'">原始/整理</button><div class="source" id="src-'+b.id+'">'+esc(b.sourceText===b.processedText?'原始文字与整理后文字相同。':b.sourceText)+'</div>':'');c.appendChild(el);const fig=D.figures.find(f=>b.processedText.replace(/\s/g,'').startsWith(f.label));if(fig){const f=document.createElement('figure');f.className='fig';f.innerHTML=fig.imageData?'<img src="'+fig.imageData+'" alt="'+esc(fig.caption)+'"><small>'+esc(fig.label+' '+fig.caption)+' · 点击查看原始页</small>':'<div class="notice">'+esc(fig.label+' '+fig.caption)+'：原图缺失，待补充。</div>';c.appendChild(f)}}bindContent();buildToc();renderNotes()}
function bindContent(){$$('.source-toggle').forEach(x=>x.onclick=()=>$('#src-'+x.dataset.source).classList.toggle('open'));$$('mark').forEach(x=>x.onclick=()=>editAnn(x.dataset.ann));$$('.fig img').forEach(x=>x.onclick=()=>{$('#largeImage').src=x.src;$('#imageModal').classList.add('open')})}
function buildToc(){const n=$('#toc'),select=$('#sectionFilter');n.innerHTML='';select.innerHTML='<option value="">全部章节</option>';D.blocks.filter(b=>b.kind==='heading').forEach(b=>{const a=document.createElement('a');a.href='#'+b.id;a.textContent=b.processedText;a.onclick=closeDrawers;n.appendChild(a);const o=document.createElement('option');o.value=b.sectionId;o.textContent=b.processedText;select.appendChild(o)});const terms=$('#terms');terms.innerHTML='';D.terms.forEach(t=>{const d=document.createElement('div');d.className='note';d.innerHTML='<b>'+esc(t.display)+'</b><div>'+esc(t.definition)+'</div><div class="meta">'+esc(t.definitionSourceType)+' · '+t.blockIds.length+' 处</div>';d.onclick=()=>{location.hash=t.blockIds[0];closeDrawers()};terms.appendChild(d)})}
function selectionInfo(){const s=getSelection();if(!s||s.rangeCount!==1||s.isCollapsed)return null;const r=s.getRangeAt(0),el=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement,b=el.closest('.block');if(!b||r.toString().trim()===''||r.startContainer!==r.endContainer)return null;const pre=document.createRange();pre.selectNodeContents(b);pre.setEnd(r.startContainer,r.startOffset);const start=pre.toString().length,end=start+r.toString().length;return{block:D.blocks.find(x=>x.id===b.id),start,end,text:r.toString()}}
function addAnn(color){const x=selectionInfo();if(!x){alert('请选择同一段落内的文字；跨段选择会拆坏锚点，因此未保存。');return}if(annFor(x.block.id).some(a=>Math.max(a.start,x.start)<Math.min(a.end,x.end))){alert('该范围与已有标注重叠，请先编辑或删除已有标注。');return}const note=prompt('添加批注（可留空，仅高亮）','')??null;if(note===null)return;state.annotations.push({id:crypto.randomUUID(),blockId:x.block.id,start:x.start,end:x.end,exact:x.text,prefix:x.block.processedText.slice(Math.max(0,x.start-12),x.start),suffix:x.block.processedText.slice(x.end,x.end+12),color,note,updatedAt:new Date().toISOString(),pdfPages:x.block.pdfPages});save();render();location.hash=x.block.id}
function editAnn(id){const a=state.annotations.find(x=>x.id===id);if(!a)return;const choice=prompt('编辑批注；输入 /delete 删除，或 /yellow /blue /green /pink 改色',a.note||'');if(choice===null)return;if(choice==='/delete'){a.deleted=true;state.tombstones.push({id:a.id,deletedAt:new Date().toISOString()})}else if(/^\/(yellow|blue|green|pink)$/.test(choice)){a.color=choice.slice(1)}else a.note=choice;a.updatedAt=new Date().toISOString();save();render()}
function visibleNotes(){const color=$('#colorFilter').value,section=$('#sectionFilter').value,q=$('#noteFilter').value.trim().toLowerCase();return state.annotations.filter(a=>{const b=D.blocks.find(x=>x.id===a.blockId);return !a.deleted&&(!color||a.color===color)&&(!section||b?.sectionId===section)&&(!q||(a.note+' '+a.exact).toLowerCase().includes(q))})}function renderNotes(){const n=$('#notes'),list=visibleNotes();n.innerHTML='';if(!list.length)n.innerHTML='<p class="status">暂无符合条件的批注</p>';for(const a of list){const d=document.createElement('div');d.className='note';d.innerHTML='<label><input type="checkbox" '+(selectedNotes.has(a.id)?'checked':'')+'> 选择导出</label><div><span class="swatch '+a.color+'" style="display:inline-block;width:12px;height:12px"></span> '+esc(a.exact)+'</div><div>'+esc(a.note||'仅高亮')+'</div><div class="meta">物理页 '+a.pdfPages.join(', ')+(a.unlocated?' · 锚点待重新定位':'')+'</div><button class="action">定位并编辑</button>';d.querySelector('input').onchange=e=>{e.target.checked?selectedNotes.add(a.id):selectedNotes.delete(a.id)};d.querySelector('button').onclick=()=>{location.hash=a.blockId;closeDrawers();setTimeout(()=>editAnn(a.id),250)};n.appendChild(d)}}
function applySettings(){document.body.className=state.settings.theme==='paper'?'':state.settings.theme;document.documentElement.style.setProperty('--font',state.settings.font+'px');document.documentElement.style.setProperty('--leading',state.settings.leading/10);document.documentElement.style.setProperty('--measure',state.settings.width+'px');$('#theme').value=state.settings.theme;$('#fontSize').value=state.settings.font;$('#lineHeight').value=state.settings.leading;$('#width').value=state.settings.width}
function openDrawer(side){closeDrawers();$(side).classList.add('open')}function closeDrawers(){$$('.drawer').forEach(x=>x.classList.remove('open'))}$$('.close').forEach(x=>x.onclick=closeDrawers);$('#tocBtn').onclick=()=>openDrawer('#leftDrawer');$('#searchBtn').onclick=()=>{openDrawer('#leftDrawer');$('#search').focus()};$('#toolsBtn').onclick=()=>openDrawer('#rightDrawer');$$('.swatch[data-color]').forEach(x=>x.onclick=()=>addAnn(x.dataset.color));$('#colorFilter').onchange=renderNotes;$('#sectionFilter').onchange=renderNotes;$('#noteFilter').oninput=renderNotes;$('#selectVisible').onclick=()=>{visibleNotes().forEach(a=>selectedNotes.add(a.id));renderNotes()};$('#clearSelection').onclick=()=>{selectedNotes.clear();renderNotes()};
$('#search').oninput=e=>{const q=e.target.value.trim().toLowerCase(),r=$('#searchResults');r.innerHTML='';if(!q)return;const hits=[];D.blocks.forEach(b=>{if((b.processedText+' '+b.sourceText).toLowerCase().includes(q))hits.push({id:b.id,text:b.processedText,page:b.pdfPages[0]})});state.annotations.filter(a=>!a.deleted&&(a.note+' '+a.exact).toLowerCase().includes(q)).forEach(a=>hits.push({id:a.blockId,text:'批注：'+a.note,page:a.pdfPages[0]}));hits.slice(0,40).forEach(h=>{const a=document.createElement('a');a.className='result';a.href='#'+h.id;a.innerHTML=esc(h.text.slice(0,80))+' <small>第'+h.page+'页</small>';a.onclick=closeDrawers;r.appendChild(a)})};
['theme','fontSize','lineHeight','width'].forEach(id=>$('#'+id).oninput=e=>{state.settings[id==='fontSize'?'font':id==='lineHeight'?'leading':id]=id==='theme'?e.target.value:+e.target.value;applySettings();save()});
$('#exportJson').onclick=()=>download(filenameBase+'-阅读数据备份.json','application/json',JSON.stringify(state,null,2));$('#importJson').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.schemaVersion!==1||x.documentId!==D.documentId||!Array.isArray(x.annotations)||!Array.isArray(x.tombstones||[]))throw Error('备份版本、类型或文档不匹配');download(filenameBase+'-导入前备份.json','application/json',JSON.stringify(state,null,2));const map=new Map(state.annotations.map(a=>[a.id,a]));for(const a of x.annotations){if(!a.id||!a.blockId||typeof a.start!=='number'||typeof a.end!=='number')throw Error('批注记录格式不完整');const old=map.get(a.id);if(!old||String(a.updatedAt)>String(old.updatedAt))map.set(a.id,a)}const tomb=new Map([...(state.tombstones||[]),...(x.tombstones||[])].map(t=>[t.id,t]));for(const a of map.values()){const b=D.blocks.find(z=>z.id===a.blockId);a.unlocated=!b||b.processedText.slice(a.start,a.end)!==a.exact;if(tomb.has(a.id))a.deleted=true}state={...state,...x,annotations:[...map.values()],tombstones:[...tomb.values()]};save();applySettings();render();alert('导入完成；同 ID 冲突采用更新时间较新的记录，删除记录优先，无法验证的锚点标为待重新定位。')}catch(err){alert('导入失败：'+err.message)}};
const filteredNotes=()=>{const selected=state.annotations.filter(a=>selectedNotes.has(a.id)&&!a.deleted);return selected.length?selected:visibleNotes()};const notesText=()=>filteredNotes().map(a=>'## '+a.exact+'\n\n'+(a.note||'仅高亮')+'\n\n来源：物理页 '+a.pdfPages.join(', ')+'，段落 '+a.blockId).join('\n\n');$('#exportMd').onclick=()=>download(filenameBase+'-阅读笔记.md','text/markdown;charset=utf-8','# '+esc(D.metadata.title||'PDF')+'阅读笔记\n\n'+notesText());$('#exportWord').onclick=()=>download(filenameBase+'-阅读笔记.doc','application/msword','<html><meta charset="utf-8"><body><h1>'+esc(D.metadata.title||'PDF')+'阅读笔记</h1>'+filteredNotes().map(a=>'<h2>'+esc(a.exact)+'</h2><p>'+esc(a.note||'仅高亮')+'</p><p>来源：物理页 '+a.pdfPages.join(', ')+'，段落 '+a.blockId+'</p>').join('')+'</body></html>');$('#exportHtml').onclick=()=>{const clone=document.documentElement.cloneNode(true),script=clone.querySelector('#documentData');const exported={...D,embeddedState:state};script.textContent=JSON.stringify(exported).replace(/<\//g,'<\\/');download(filenameBase+'-含批注阅读器.html','text/html;charset=utf-8','<!doctype html>'+clone.outerHTML)};
$('#copyCitation').onclick=async()=>{const x=selectionInfo(),b=x?.block;if(!x){alert('请先选择正文文字。');return}const heading=[...D.blocks].reverse().find(y=>y.kind==='heading'&&D.blocks.indexOf(y)<=D.blocks.indexOf(b));const citation='“'+x.text+'”——《'+D.metadata.title+'》'+(heading?'，'+heading.processedText:'')+'，物理页 '+b.pdfPages.join(', ');try{await navigator.clipboard.writeText(citation);alert('已复制出处')}catch(e){prompt('复制以下出处',citation)}};
$('#closeImage').onclick=()=>$('#imageModal').classList.remove('open');$('#imageModal').onclick=e=>{if(e.target===$('#imageModal'))e.currentTarget.classList.remove('open')};let timer;window.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(()=>{const els=$$('.block'),hit=els.find(el=>el.getBoundingClientRect().top>80)||els.at(-1);if(hit){state.position=hit.id;save()}},250)},{passive:true});applySettings();render();if(D.embeddedState&&(!localStorage.getItem(key))){state=D.embeddedState;save();applySettings();render()}setTimeout(()=>{if(state.position&&$('#'+state.position))$('#'+state.position).scrollIntoView()},150);
})();
</script></body></html>
